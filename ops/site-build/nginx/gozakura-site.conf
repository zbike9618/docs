# server { } の中で include する（例: include /etc/nginx/snippets/gozakura-site.conf;）。
# 前提: conf.d/gozakura-strip-html.conf（map）が読み込まれていること。
# 公開ディレクトリは /var/www/site/current（site-build が差し替える symlink）。

# cloudflared 経由なので、Location は相対にする
absolute_redirect off;

# 旧形式の記事 URL → 記事ページ。検索エンジンの評価を引き継げるよう 301 にする
location = /news/view      { if ($arg_id ~ "^[0-9]+$") { return 301 /news/$arg_id; } return 301 /news; }
location = /news/view.html { if ($arg_id ~ "^[0-9]+$") { return 301 /news/$arg_id; } return 301 /news; }
location = /blog/view      { if ($arg_id ~ "^[0-9]+$") { return 301 /blog/$arg_id; } return 301 /blog; }
location = /blog/view.html { if ($arg_id ~ "^[0-9]+$") { return 301 /blog/$arg_id; } return 301 /blog; }

# .html 付きの URL は付かない形へ（変換表は conf.d/gozakura-strip-html.conf）
if ($gozakura_strip_html) { return 301 $gozakura_strip_html; }

# 見つからないときは VitePress が作った 404 ページを出す（直接開かれても 404 を返す）
error_page 404 /404.html;
location = /404.html { internal; }
location = /404 { return 404; }
