# /etc/nginx/conf.d/ に置く（http コンテキスト）。
# .html 付きの URL を、付かない正規の URL に寄せるための変換表。
#   /news.html            → /news
#   /guide/start.html     → /guide/start
#   /index.html           → /
#   /banlist/index.html   → /banlist/
# $request_uri（最初に来た URL）で見るので、error_page などの内部リダイレクトでは動かない。
map $request_uri $gozakura_strip_html {
    default "";
    ~^(?<p>(?:/[^?]*)?)/index\.html(?<q>\?.*)?$ "$p/$q";
    ~^(?<p>/[^?]*)\.html(?<q>\?.*)?$            "$p$q";
}
