name: Deploy VitePress site to GitHub Pages

# 本番（www.gozakura.org）の公開は、CT111 の中のビルダー（ops/site-build）が行う。
# 2026-10-22 から、main への push ではこの workflow は動かない（Tailscale 経由の rsync はやめた）。
# ここに残っているのは、GitHub Pages 用（pages ブランチ、base が /docs/）のビルドだけ。
on:
  push:
    branches:
      - pages

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # キャッシュと前回のビルド成果物を完全に削除して、確実に再ビルドさせる
      - name: Clean VitePress cache and dist
        run: rm -rf docs/.vitepress/dist docs/.vitepress/.vitepress-cache

      # お知らせなどの中身は、ビルド時に公開 API（https://api.gozakura.org）から取って焼く
      - name: Build with VitePress for GitHub Pages
        run: npm run docs:build

      # 念のため Pages 用にビルドされた中身があるかログで確認
      - name: Check dist directory
        run: ls -la docs/.vitepress/dist

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy-pages:
    environment:
      name: github-pages
    needs: build-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
