name: Deploy VitePress site to Pages & Local LXC

on:
  push:
    branches: [main]

# GitHub Pagesへのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy-lxc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build with VitePress
        run: npm run docs:build

      # GitHub Pages用のアーティファクトをアップロード
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      # 1. Tailscale に接続（サブネットルーター経由の通信を有効化）
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_OAUTH_SECRET }}
          args: --accept-routes  # ← これを追加

      # 2. SSHの秘密鍵を設定
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LXC_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      # 3. サブネットルーター経由でLXC（192.168.11.120）へデプロイ
      - name: Deploy to LXC via rsync
        run: rsync -avz --delete docs/.vitepress/dist/ ${{ secrets.LXC_USER }}@192.168.11.120:/var/www/html/

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build-and-deploy-lxc
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4